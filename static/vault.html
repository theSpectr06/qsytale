<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>Qsytale Vault</title>
    <link rel="stylesheet" href="./m3.css?v=ui1">
</head>
<body data-page="vault" data-title="Vault">
    <main>
        <p id="whoami" class="note">Loading...</p>

        <section id="unlock-section" class="card">
            <h2>Unlock this device</h2>
            <p class="supporting">Your private keys stay in this browser, protected by your passphrase.</p>
            <label class="field">
                <input id="pass" type="password" placeholder=" " autocomplete="off">
                <span>Passphrase</span>
            </label>
            <button id="unlock">Unlock</button>
        </section>

        <div id="vault-section" hidden>
            <section class="card">
                <h2>Encrypt and upload</h2>
                <p class="supporting">Choose how the file key is protected. The file itself is always AES-256-GCM.</p>
                <div class="segmented" role="radiogroup" aria-label="Encryption mode">
                    <label><input type="radio" name="mode" value="classical" checked><span>Classical (RSA)</span></label>
                    <label><input type="radio" name="mode" value="post-quantum"><span>Post-quantum (ML-KEM)</span></label>
                </div>
                <input id="file" type="file">
                <button id="upload">Encrypt and upload</button>
            </section>

            <section class="card">
                <h2>Files <button id="refresh" class="tonal small">Refresh</button></h2>
                <ul id="files"></ul>
            </section>
        </div>

        <div class="status"><div class="label">Status</div><pre id="log">Ready.</pre></div>
    </main>

    <script type="module" src="./nav.js?v=ui1"></script>
    <script type="module" src="./vault.js?v=ui1"></script>
</body>
</html>
